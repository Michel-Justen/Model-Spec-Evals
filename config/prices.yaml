# Token prices in USD per 1,000,000 tokens.
# Placeholder values — check against https://openai.com/api/pricing before relying on them.
# The grader (gpt-5) dominates total cost, so its price matters most.
# "cached_input" is the price for prompt-cache hits. Reasoning tokens bill at the output rate.

grader:
  # Grader used for apples-to-apples comparison with OpenAI's published bars.
  openai/gpt-5:
    input: 1.25
    cached_input: 0.125     # 90% discount on cache hits
    output: 10.00           # reasoning tokens billed here too

candidates:
  # Candidate models we score. Prices only affect the (small) candidate share of cost.
  openai/gpt-5.4:      { input: 1.25, cached_input: 0.125, output: 10.00, reasoning: true }
  openai/gpt-5.5:      { input: 1.25, cached_input: 0.125, output: 10.00, reasoning: true }
  openai/gpt-5.6-sol:  { input: 1.75, cached_input: 0.175, output: 14.00, reasoning: true }
  openai/gpt-5-nano:   { input: 0.05, cached_input: 0.005, output: 0.40,  reasoning: true }   # smoke-test candidate
  openai/gpt-4o-mini:  { input: 0.15, cached_input: 0.015, output: 0.60,  reasoning: false }
